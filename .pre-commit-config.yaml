# .pre-commit-config.yaml
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ── Standard file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ── Secret scanning ────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Markdown / prose linting ───────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033', 'MD041']

  # ── Local: run the full pre-commit script (bash) ──────────────────────────
  - repo: local
    hooks:
      - id: pre-commit-check-sh
        name: Run pre-commit-check.sh
        language: script
        entry: scripts/pre-commit-check.sh
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ── Local: run the full pre-commit script (PowerShell, cross-platform) ────
  # Uncomment on Windows or when using pwsh:
  # - repo: local
  #   hooks:
  #     - id: pre-commit-check-ps1
  #       name: Run pre-commit-check.ps1
  #       language: script
  #       entry: pwsh -NonInteractive -File scripts/pre-commit-check.ps1
  #       pass_filenames: false
  #       always_run: true
  #       stages: [pre-commit]
