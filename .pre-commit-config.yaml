repos:
  - repo: local
    hooks:
      - id: markdown-toc
        name: Generate Markdown TOCs
        entry: bash -c 'npx markdown-toc -i "$1"'
        language: system
        types: [markdown]
        files: '^docs/(USER_GUIDE|PLATFORM_ADAPTERS|PROJECT_MANAGEMENT|QUICKSTART).*\.md$'
        exclude: '^docs/(GLOSSARY|REFERENCE)/.*\.md$'
        args: [--maxdepth=3, --no-first-h1]